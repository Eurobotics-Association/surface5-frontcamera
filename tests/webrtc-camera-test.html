<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surface Pro 5 WebRTC camera diagnostic</title>
  <style>
    body { background: #101418; color: #e8edf2; font: 16px/1.45 system-ui, sans-serif; margin: 2rem; max-width: 72rem; }
    button { font: inherit; padding: .55rem .85rem; }
    video { background: #000; display: block; margin: 1rem 0; max-height: 60vh; max-width: 100%; }
    pre { background: #181e25; border: 1px solid #36404b; overflow-wrap: anywhere; padding: 1rem; white-space: pre-wrap; }
    .ok { color: #75e096; } .error { color: #ff8f8f; } .timeout { color: #ffd36e; }
  </style>
</head>
<body>
  <h1>WebRTC camera diagnostic</h1>
  <p>This local page tests each browser camera API step independently. It records only textual API results to the private result directory created by the shell helper; it never captures or uploads frames.</p>
  <button id="run" type="button">Run default-then-front test</button>
  <button id="run-front" type="button">Run permission-then-front test</button>
  <video id="preview" autoplay muted playsinline></video>
  <canvas id="analysis" hidden></canvas>
  <pre id="output" aria-live="polite">Waiting to run.</pre>
  <script>
    'use strict';
    const timeoutMs = 12_000;
    const output = document.querySelector('#output');
    const video = document.querySelector('#preview');
    const analysis = document.querySelector('#analysis');
    const runButton = document.querySelector('#run');
    const frontButton = document.querySelector('#run-front');
    let stream;

    function compact(value) {
      if (value instanceof Error) return { name: value.name, message: value.message };
      return value;
    }
    function render(kind, message, detail) {
      const line = document.createElement('div');
      line.className = kind;
      line.textContent = `${new Date().toISOString()} ${message}${detail === undefined ? '' : ` ${JSON.stringify(detail)}`}`;
      output.append(line);
      output.scrollTop = output.scrollHeight;
      void fetch('/report', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timestamp: new Date().toISOString(), event: message, detail: compact(detail) })
      }).catch(() => {});
    }
    async function within(label, promise, reportValue = value => value) {
      const started = performance.now();
      let timer;
      try {
        const result = await Promise.race([
          promise,
          new Promise((_, reject) => { timer = setTimeout(() => reject(new DOMException(`${label} exceeded ${timeoutMs} ms`, 'TimeoutError')), timeoutMs); })
        ]);
        render('ok', `${label}_OK`, { elapsedMs: Math.round(performance.now() - started), value: reportValue(result) });
        return result;
      } catch (error) {
        const timeout = error && error.name === 'TimeoutError';
        render(timeout ? 'timeout' : 'error', `${label}_${timeout ? 'TIMEOUT' : 'ERROR'}`, { elapsedMs: Math.round(performance.now() - started), error: compact(error) });
        return undefined;
      } finally { clearTimeout(timer); }
    }
    function deviceSummary(devices) {
      return devices.map(({ kind, label, deviceId, groupId }) => ({ kind, label, deviceId: deviceId ? 'present' : '', groupId: groupId ? 'present' : '' }));
    }
    async function stopCurrentStream() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = undefined;
      video.srcObject = null;
      // PipeWire/libcamera source teardown is asynchronous. Do not turn a
      // controlled camera switch into a concurrent stream reconfiguration.
      await new Promise(resolve => setTimeout(resolve, 750));
    }
    function waitForPlayback() {
      return new Promise((resolve, reject) => {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA && video.videoWidth) return resolve();
        video.addEventListener('playing', resolve, { once: true });
        video.addEventListener('error', () => reject(video.error || new Error('video element error')), { once: true });
      });
    }
    async function inspectFrames(step) {
      const context = analysis.getContext('2d', { willReadFrequently: true });
      const samples = [];
      let previousChecksum;
      for (let sample = 0; sample < 4; sample += 1) {
        await new Promise(resolve => setTimeout(resolve, 250));
        const width = Math.min(64, video.videoWidth);
        const height = Math.min(36, video.videoHeight);
        if (!width || !height) continue;
        analysis.width = width;
        analysis.height = height;
        context.drawImage(video, 0, 0, width, height);
        const pixels = context.getImageData(0, 0, width, height).data;
        let minimum = 255;
        let maximum = 0;
        let total = 0;
        let checksum = 0;
        for (let index = 0; index < pixels.length; index += 4) {
          const luma = Math.round((54 * pixels[index] + 183 * pixels[index + 1] + 19 * pixels[index + 2]) / 256);
          minimum = Math.min(minimum, luma);
          maximum = Math.max(maximum, luma);
          total += luma;
          checksum = (checksum + luma * ((index / 4) + 1)) >>> 0;
        }
        samples.push({ minimum, maximum, mean: Math.round((total / (pixels.length / 4)) * 100) / 100, changed: previousChecksum === undefined ? null : checksum !== previousChecksum });
        previousChecksum = checksum;
      }
      const allBlack = samples.length > 0 && samples.every(sample => sample.maximum === 0);
      const changedFrames = samples.filter(sample => sample.changed === true).length;
      render(allBlack ? 'error' : 'ok', `${step}_FRAME_PIXELS`, { samples, allBlack, changedFrames, note: 'In-memory statistics only; no image data is stored or uploaded.' });
      return { allBlack, changedFrames };
    }
    async function showStream(step, newStream) {
      stream = newStream;
      const track = stream.getVideoTracks()[0];
      render('ok', `${step}_VIDEO_TRACK`, { label: track?.label || '', readyState: track?.readyState || '', settings: track?.getSettings?.() || {}, capabilities: track?.getCapabilities?.() || {} });
      video.srcObject = stream;
      await within(`${step}_VIDEO_PLAYBACK`, Promise.resolve(video.play()).then(waitForPlayback));
      render(video.videoWidth && video.videoHeight ? 'ok' : 'error', `${step}_VIDEO_DIMENSIONS`, { videoWidth: video.videoWidth, videoHeight: video.videoHeight, readyState: video.readyState });
      await inspectFrames(step);
      return track?.label || '';
    }
    async function run(mode) {
      runButton.disabled = true;
      frontButton.disabled = true;
      output.replaceChildren();
      await stopCurrentStream();
      render('ok', 'TEST_START', { secureContext: window.isSecureContext, origin: location.origin, timeoutMs, mode });
      const mediaDevices = navigator.mediaDevices;
      render(mediaDevices ? 'ok' : 'error', 'MEDIADEVICES', { present: Boolean(mediaDevices), enumerateDevices: Boolean(mediaDevices?.enumerateDevices), getUserMedia: Boolean(mediaDevices?.getUserMedia) });
      if (!mediaDevices?.enumerateDevices || !mediaDevices?.getUserMedia) { runButton.disabled = false; frontButton.disabled = false; return; }
      const before = await within('ENUMERATE_BEFORE', mediaDevices.enumerateDevices(), deviceSummary);
      if (before) render('ok', 'ENUMERATE_BEFORE_VIDEOINPUT_COUNT', { count: before.filter(device => device.kind === 'videoinput').length });
      let front = before?.find(device => device.kind === 'videoinput' && /front/i.test(device.label));
      if (mode === 'permission-then-front') {
        if (!front?.deviceId) {
          render('ok', 'FRONT_LABEL_HIDDEN_BEFORE_PERMISSION', { note: 'Browser privacy behavior: obtaining permission is required before selecting a labeled physical camera.' });
          const permissionStream = await within('GETUSERMEDIA_PERMISSION_PROBE', mediaDevices.getUserMedia({ video: true, audio: false }));
          if (permissionStream) {
            await showStream('PERMISSION_PROBE', permissionStream);
            await stopCurrentStream();
          }
          const afterPermission = await within('ENUMERATE_AFTER_PERMISSION_PROBE', mediaDevices.enumerateDevices(), deviceSummary);
          front = afterPermission?.find(device => device.kind === 'videoinput' && /front/i.test(device.label));
        }
        if (!front?.deviceId) {
          render('error', 'FRONT_CAMERA_NOT_AVAILABLE_AFTER_PERMISSION');
        } else {
          render('ok', 'FRONT_CAMERA_SELECTED', { label: front.label, phase: 'after-permission' });
          const frontStream = await within('GETUSERMEDIA_FRONT', mediaDevices.getUserMedia({ video: { deviceId: { exact: front.deviceId } }, audio: false }));
          if (frontStream) await showStream('FRONT', frontStream);
        }
        const afterFront = await within('ENUMERATE_AFTER', mediaDevices.enumerateDevices(), deviceSummary);
        if (afterFront) render('ok', 'ENUMERATE_AFTER_VIDEOINPUT_COUNT', { count: afterFront.filter(device => device.kind === 'videoinput').length });
        render('ok', 'STREAM_STOPPING');
        await stopCurrentStream();
        render('ok', 'STREAM_STOPPED');
        render('ok', 'TEST_COMPLETE');
        runButton.disabled = false;
        frontButton.disabled = false;
        return;
      }
      stream = await within('GETUSERMEDIA', mediaDevices.getUserMedia({ video: true, audio: false }));
      const defaultLabel = stream ? await showStream('DEFAULT', stream) : '';
      const after = await within('ENUMERATE_AFTER', mediaDevices.enumerateDevices(), deviceSummary);
      if (after) render('ok', 'ENUMERATE_AFTER_VIDEOINPUT_COUNT', { count: after.filter(device => device.kind === 'videoinput').length });
      const frontAfter = after?.find(device => device.kind === 'videoinput' && /front/i.test(device.label));
      if (frontAfter?.deviceId && /front/i.test(defaultLabel)) {
        render('ok', 'FRONT_CAMERA_ALREADY_ACTIVE', { label: defaultLabel });
      } else if (frontAfter?.deviceId) {
        render('ok', 'FRONT_CAMERA_SELECTED', { label: frontAfter.label });
        await stopCurrentStream();
        const frontStream = await within('GETUSERMEDIA_FRONT', mediaDevices.getUserMedia({ video: { deviceId: { exact: frontAfter.deviceId } }, audio: false }));
        if (frontStream) await showStream('FRONT', frontStream);
      } else {
        render('error', 'FRONT_CAMERA_NOT_AVAILABLE_AFTER_PERMISSION');
      }
      render('ok', 'STREAM_STOPPING');
      await stopCurrentStream();
      render('ok', 'STREAM_STOPPED');
      render('ok', 'TEST_COMPLETE');
      runButton.disabled = false;
      frontButton.disabled = false;
    }
    runButton.addEventListener('click', () => void run('default-then-front'));
    frontButton.addEventListener('click', () => void run('permission-then-front'));
  </script>
</body>
</html>
